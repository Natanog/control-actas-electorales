services:
  votemonitorapi:
    image: votemonitorapi
    build:
      context: api
      dockerfile: src/Vote.Monitor.Api/Dockerfile
      args:
        - BUILD_CONFIGURATION=Development
        - REVISION=LocalBuild
    container_name: votemonitorapi
    env_file:
      - .env
    environment:
      ACTA_OCR_ENABLED: "true"
      ACTA_OCR_BASE_URL: "http://acta-ocr:8000"
      ACTA_OCR_REVIEW_THRESHOLD: "0.85"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_started
      acta-ocr:
        condition: service_healthy

  acta-ocr:
    build:
      context: services/acta-ocr
      dockerfile: Dockerfile
    container_name: acta-ocr
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  posgress_ui:
    image: dpage/pgadmin4
    restart: always
    container_name: pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@code.com
      PGADMIN_DEFAULT_PASSWORD: pass
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: docker
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "log_statement=all"]
    container_name: postgresql-local
    volumes:
      - db-data:/var/lib/postgresql/data:rw,size=200m

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    volumes:
      - ./.data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATA_FILE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  hangfire:
    image: votemonitorhangfire
    build:
      context: api
      dockerfile: src/Vote.Monitor.Hangfire/Dockerfile
      args:
        - BUILD_CONFIGURATION=Development
        - REVISION=LocalBuild
    container_name: votemonitorhangfire
    env_file:
      - .env
    ports:
      - "5001:8080"
    depends_on:
      db:
        condition: service_started

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    env_file:
      - .env
    command: server /data --console-address ":9001"

volumes:
  db-data:
    driver: local
  minio_data:
    driver: local
